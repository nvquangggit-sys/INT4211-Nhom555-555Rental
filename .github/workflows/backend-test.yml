# Chạy kiểm thử backend mỗi lần push.
# Bộ test dùng PGlite (PostgreSQL nhúng) nên không cần service PostgreSQL riêng.
name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra schema.sql + seed.sql
        run: npm run test:sql

      - name: Kiểm thử API end-to-end
        run: npm run test:api
